      <ellipse cx="-9" cy="-9" rx="7" ry="9" transform="rotate(-45 -9 -9)"/><ellipse cx="9" cy="9" rx="7" ry="9" transform="rotate(-45 9 9)"/><ellipse cx="9" cy="-9" rx="7" ry="9" transform="rotate(45 9 -9)"/><ellipse cx="-9" cy="9" rx="7" ry="9" transform="rotate(45 -9 9)"/></g>
    <circle r="9" fill="#ffcc33"/><circle cx="-3" cy="-1.5" r="1.6" fill="#2b2b3a"/><circle cx="3" cy="-1.5" r="1.6" fill="#2b2b3a"/><path d="M-3.5 2.5q3.5 3 7 0" fill="none" stroke="#2b2b3a" stroke-width="1.5" stroke-linecap="round"/>
