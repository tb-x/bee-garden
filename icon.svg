  <rect x="14" y="20" width="152" height="146" rx="16" fill="#5d9c3f"/>
  <g>
    <rect x="22" y="28" width="44" height="42" rx="6" fill="#a2e67e"/><rect x="68" y="28" width="44" height="42" rx="6" fill="#6cc94a"/><rect x="114" y="28" width="44" height="42" rx="6" fill="#a2e67e"/>
    <rect x="22" y="72" width="44" height="42" rx="6" fill="#6cc94a"/><rect x="68" y="72" width="44" height="42" rx="6" fill="#a2e67e"/><rect x="114" y="72" width="44" height="42" rx="6" fill="#6cc94a"/>
    <rect x="22" y="116" width="44" height="42" rx="6" fill="#a2e67e"/><rect x="68" y="116" width="44" height="42" rx="6" fill="#6cc94a"/><rect x="114" y="116" width="44" height="42" rx="6" fill="#a2e67e"/>
  </g>
  <g fill="#ffb703"><circle cx="90" cy="137" r="5"/><circle cx="136" cy="137" r="5"/><circle cx="136" cy="93" r="5"/></g>
