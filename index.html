<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bee Garden</title>
<meta name="theme-color" content="#9ED8F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  /* Layout: 3D garden fills the stage above (portrait) or left of (landscape) the control panel; the panel holds the plan strip (the bee's cards in order) over the card pad and the Go button; home top-left, level dots top-centre, hint and mute top-right; the win card is an overlay */
  :root{
    --sky:#9ED8F7; --cream:#FFF8E7; --lip:#E6D3A8; --ink:#2B2B3A; --honey:#FFC93C; --honey-edge:#E59A00;
    --go:#35C24A; --go-edge:#23912F; --stop:#F25C54; --stop-edge:#B83A33; --panel:#FFEFC2; --panel-edge:#F2D488;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    --slot:clamp(38px,12.5vw,54px); --key:clamp(52px,15vw,70px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);font-family:var(--title);color:var(--ink);
    touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr}
  #stage{position:relative;min-height:0;min-width:0;overflow:hidden}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none}
  svg{display:block}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #dots{position:absolute;top:calc(14px + var(--st));left:64px;right:120px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;z-index:20}
  .dot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;
    font:bold 12px/1 Verdana,Tahoma,sans-serif;color:rgba(43,43,58,.45)}
  .dot.done{background:var(--honey);color:#7a4b00}
  .dot.now{background:#fff;color:var(--ink);box-shadow:0 0 0 3px var(--honey-edge)}
  .dot.locked{opacity:.45}
  .dot.gap{margin-left:10px}
  #hudR{position:fixed;z-index:46;top:calc(10px + var(--st));right:calc(10px + var(--sr));display:flex;gap:10px}
  .round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .round svg{width:26px;height:26px}
  .round:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #hint{background:#FFF3B0;animation:glow 1.4s ease-in-out infinite}
  #hint.on{background:var(--honey);animation:none}

  /* ---------- panel: plan strip, card pad, go ---------- */
  #panel{background:var(--panel);border-top:4px solid var(--panel-edge);padding:10px calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl));
    display:flex;flex-direction:column;align-items:center;gap:10px;z-index:30}
  #prog{display:grid;grid-template-columns:repeat(6,var(--slot));gap:6px;padding:8px;border-radius:16px;background:rgba(255,255,255,.6)}
  .slot{width:var(--slot);height:var(--slot);border-radius:12px;border:2.5px dashed rgba(43,43,58,.18)}
  .slot.next{border-color:rgba(43,43,58,.45)}
  #prog.empty .slot.next{animation:pulse 1.2s ease-in-out infinite}
  .card{width:var(--slot);height:var(--slot);border-radius:12px;display:grid;place-items:center;color:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .15s,opacity .2s}
  .card svg{width:72%;height:72%}
  .card.now{transform:scale(1.14);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--honey-edge)}
  .card.done{opacity:.5}
  .card.bad{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--stop);animation:shake .45s ease-in-out 2}
  .card.pop{animation:pop .25s ease-out}
  #controls{display:flex;align-items:center;gap:18px}
  #pad{display:grid;grid-template-columns:repeat(3,var(--key));grid-auto-rows:var(--key);gap:6px}
  .key{border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
  .key svg{width:68%;height:68%}
  .key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .key.face{background:none;box-shadow:none;pointer-events:none}
  .key.face svg{width:84%;height:84%}
  #actions{display:flex;flex-direction:column;align-items:center;gap:10px}
  #go{width:calc(var(--key)*1.35);height:calc(var(--key)*1.35);border-radius:50%;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-edge);display:grid;place-items:center}
  #go svg{width:52%;height:52%}
  #go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--go-edge)}
  #go.stop{background:var(--stop);box-shadow:0 6px 0 var(--stop-edge)}
  #undo{width:var(--key);height:calc(var(--key)*.75);border-radius:14px;background:var(--cream);box-shadow:0 4px 0 var(--lip);display:grid;place-items:center;color:#8a6d3b}
  #undo svg{width:46%;height:70%}
  #undo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
  body.running #pad,body.running #undo{opacity:.4;pointer-events:none}
  body.running #prog{pointer-events:none}

  /* wide, short screens (a tablet or phone held sideways): the panel goes to the right */
  @media (min-aspect-ratio:5/4){
    body{grid-template-rows:1fr;grid-template-columns:1fr auto}
    #panel{border-top:0;border-left:4px solid var(--panel-edge);justify-content:center;padding:calc(10px + var(--st)) calc(12px + var(--sr)) calc(10px + var(--sb)) 12px}
    :root{--slot:clamp(34px,min(5.6vw,8.5vh),54px);--key:clamp(46px,min(6.5vw,13vh),70px)}
  }

  /* ---------- win card ---------- */
  #win{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(255,248,231,.35)}
  #win .box{background:var(--cream);border-radius:28px;padding:22px 30px 26px;box-shadow:0 8px 0 var(--lip),0 14px 30px rgba(0,0,0,.2);
    display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .35s ease-out}
  #win .flowers{font-size:44px;line-height:1;letter-spacing:4px}
  #win h2{margin:0;font-size:30px}
  #next{width:96px;height:96px;border-radius:50%;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-edge);display:grid;place-items:center}
  #next svg{width:50%;height:50%}
  #next:active{transform:translateY(5px);box-shadow:0 1px 0 var(--go-edge)}

  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{translate:0}25%{translate:-5px}75%{translate:5px}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  @keyframes glow{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.18)}50%{box-shadow:0 0 0 6px rgba(255,201,60,.6),0 3px 0 rgba(0,0,0,.18)}}
  @keyframes nudge{0%,100%{transform:none}30%{transform:scale(1.12)}60%{transform:scale(.95)}}
  .nudge{animation:nudge .5s ease-in-out 2}
</style>
</head>

<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="dots"></div>
</div>
<div id="hudR">
  <button id="hint" class="round" aria-label="Show the way" hidden><svg viewBox="0 0 24 24"><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.9 1.1.9 1.8V17h5.8v-.9c0-.7.3-1.3.9-1.8A6.5 6.5 0 0 0 12 2.5z" fill="#FFC93C" stroke="#8a6d3b" stroke-width="1.6"/><path d="M9.3 19h5.4M10.2 21.3h3.6" stroke="#8a6d3b" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button id="mute" class="round" aria-label="Sound on or off"></button>
</div>
<div id="panel">
  <div id="prog" aria-label="The bee's plan"></div>
  <div id="controls">
    <div id="pad"></div>
    <div id="actions">
      <button id="go" aria-label="Go"></button>
      <button id="undo" aria-label="Take back the last card"><svg viewBox="0 0 24 20"><path d="M8 2h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8L1 10z" fill="currentColor"/><path d="M11 7l6 6m0-6-6 6" stroke="#FFF8E7" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>

  <div class="box">
    <div class="flowers" id="winFlowers"></div>
    <h2 id="winText">Yum!</h2>
    <button id="next" aria-label="Next garden"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ======== tuning knobs ======== */
const MAX_CARDS = 12;          // the longest plan the bee will follow (two rows of six)
const STEP_MS = 520;           // one hop to the next square
const TURN_MS = 340;           // a quarter turn on the spot
const HINT_AFTER_FAILS = 3;    // tries that don't reach every flower before the hint bulb shows up
const CAM_ELEVATION = 54;      // degrees above the ground the camera looks down from

// Map key: B bee (starts here), F flower, # bush, o rock, m mushroom, . grass.
// cards: 'arrows' = up/down/left/right (screen directions), 'turns' = forward and turn left/right (like a floor robot).
// dir is where the bee faces at the start (N is away from you); it only matters with 'turns'.
const LEVELS = [
  { cards: 'arrows', map: ['.F.', '...', '.B.'] },
  { cards: 'arrows', map: ['....', 'B..F', '....'] },
  { cards: 'arrows', map: ['..F', '...', 'B..'] },
  { cards: 'arrows', map: ['.F..', '.#..', '....', '.B..'] },
  { cards: 'arrows', map: ['F..', '.o.', 'B.F'] },
  { cards: 'arrows', map: ['..#F', '..#.', '....', 'B.m.'] },
  { cards: 'turns', dir: 'N', map: ['.F.', '...', '...', '.B.'] },
  { cards: 'turns', dir: 'E', map: ['..F', '...', 'B..'] },
  { cards: 'turns', dir: 'N', map: ['F...', '#...', '....', 'B...'] },
  { cards: 'turns', dir: 'N', map: ['F..F', '....', '.B..'] },
  { cards: 'turns', dir: 'N', map: ['..F..', '.###.', '.....', '.m.o.', '..B..'] },
  { cards: 'turns', dir: 'E', map: ['F..F', '....', '.#..', 'B..F'] },
];

/* ======== small helpers ======== */
const NS = 'beegarden.';
const load = (k, d = null) => { try { const v = localStorage.getItem(NS + k); return v === null ? d : v; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(NS + k, String(v)); } catch {} };
const TEST = /[?&]tbxtest\b/.test(location.search) || navigator.webdriver === true;
const $ = (id) => document.getElementById(id);
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];            // N E S W; y grows towards the camera
const DIRS = { N: 0, E: 1, S: 2, W: 3 };
const ABS_DIR = { up: 0, right: 1, down: 2, left: 3 };
const yawFor = (d) => Math.atan2(DX[d], DY[d]);         // the bee model faces +Z
const easeInOut = (k) => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
const easeOut = (k) => 1 - (1 - k) ** 2;
const easeIn = (k) => k * k;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ======== sound (Web Audio, all synthesized) ======== */
const Sound = (() => {
  let ac = null, out = null, buzz = null;
  let muted = TEST || load('muted') === '1';
  const NOTE = (n) => 440 * 2 ** ((n - 69) / 12);
  function ctx() {
    if (muted) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC(); out = ac.createGain(); out.gain.value = 0.8; out.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, dur, o = {}) {
    const c = ctx(); if (!c) return;
    const t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + dur + 0.05);
  }
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
  return {
    get muted() { return muted; },
    setMuted(m) { muted = m; save('muted', m ? '1' : '0'); if (m) { this.buzz(false); ac?.suspend(); } else ctx(); },
    unlock() { ctx(); },
    card(i) { tone(NOTE(60 + SCALE[i % SCALE.length]), 0.18, { type: 'triangle', vol: 0.16 }); },
    remove() { tone(520, 0.14, { to: 240, vol: 0.12 }); },
    nope() { tone(220, 0.12, { type: 'triangle', vol: 0.1 }); tone(196, 0.16, { at: 0.12, type: 'triangle', vol: 0.1 }); },
    bump() { tone(320, 0.4, { to: 80, vol: 0.26 }); tone(140, 0.12, { type: 'square', vol: 0.04 }); },
    sip() { [72, 76, 79, 84].forEach((n, i) => tone(NOTE(n), 0.2, { at: i * 0.08, type: 'triangle', vol: 0.15 })); },
    shrug() { tone(NOTE(67), 0.16, { vol: 0.13 }); tone(NOTE(63), 0.3, { at: 0.17, vol: 0.13 }); },
    whoosh() { tone(180, 0.5, { to: 700, vol: 0.06 }); },
    win() { [60, 64, 67, 72, 67, 72, 76, 79].forEach((n, i) => tone(NOTE(n), 0.22, { at: i * 0.11, type: 'triangle', vol: 0.15 })); },
    buzz(on) {
      const c = on ? ctx() : ac;
      if (on && c && !buzz) {
        const osc = c.createOscillator(), lfo = c.createOscillator(), depth = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
        osc.type = 'sawtooth'; osc.frequency.value = 210; lfo.frequency.value = 9; depth.gain.value = 14;
        f.type = 'lowpass'; f.frequency.value = 760; g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(0.035, c.currentTime + 0.15);
        lfo.connect(depth); depth.connect(osc.frequency); osc.connect(f); f.connect(g); g.connect(out);
        osc.start(); lfo.start(); buzz = { osc, lfo, g };
      } else if (!on && buzz && c) {
        const b = buzz; buzz = null; const t = c.currentTime;
        b.g.gain.cancelScheduledValues(t); b.g.gain.setValueAtTime(b.g.gain.value, t); b.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        b.osc.stop(t + 0.2); b.lfo.stop(t + 0.2);
      }
    },
  };
})();

/* ======== card pictures ======== */
const ARROW = (deg) => `<svg viewBox="0 0 24 24"><path transform="rotate(${deg} 12 12)" d="M12 2.5 21 12h-5.5v9.5h-7V12H3z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const TURN = (flip) => `<svg viewBox="0 0 24 24"><path ${flip ? 'transform="translate(24 0) scale(-1 1)"' : ''} d="M4 22V12a8 8 0 0 1 8-8h1.5V0.8L21.5 7.5 13.5 14.2V10H12a2 2 0 0 0-2 2v10z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>`;
const CARD = {
  up: { color: '#3B82F6', svg: ARROW(0), label: 'Up' },
  right: { color: '#F97316', svg: ARROW(90), label: 'Right' },
  down: { color: '#A855F7', svg: ARROW(180), label: 'Down' },
  left: { color: '#22A04B', svg: ARROW(270), label: 'Left' },
  fwd: { color: '#E0A800', svg: ARROW(0), label: 'Forward' },
  tl: { color: '#EC4899', svg: TURN(true), label: 'Turn left' },
  tr: { color: '#14A3A0', svg: TURN(false), label: 'Turn right' },
};
const BEE_FACE = `<svg viewBox="0 0 48 48"><ellipse cx="12" cy="14" rx="9" ry="6" fill="#DDF4FF" stroke="#8fb8cc" stroke-width="1.5" transform="rotate(-30 12 14)"/><ellipse cx="36" cy="14" rx="9" ry="6" fill="#DDF4FF" stroke="#8fb8cc" stroke-width="1.5" transform="rotate(30 36 14)"/><circle cx="24" cy="27" r="16" fill="#FFC93C"/><path d="M9.5 21h29M8.5 31h31" stroke="#2B2B3A" stroke-width="5"/><circle cx="18" cy="26" r="4.5" fill="#fff"/><circle cx="30" cy="26" r="4.5" fill="#fff"/><circle cx="18.8" cy="26.6" r="2.4" fill="#2B2B3A"/><circle cx="30.8" cy="26.6" r="2.4" fill="#2B2B3A"/><path d="M19 35q5 4 10 0" fill="none" stroke="#2B2B3A" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>',
  soundOn: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2B2B3A"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#2B2B3A" stroke-width="2" stroke-linecap="round"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2B2B3A"/><path d="M16.5 9.5l5 5m0-5-5 5" stroke="#F25C54" stroke-width="2.2" stroke-linecap="round"/></svg>',
};

/* ======== 3D scene ======== */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9ED8F7');
scene.fog = new THREE.Fog('#9ED8F7', 16, 34);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 80);
scene.add(new THREE.HemisphereLight('#ffffff', '#6aa84f', 1.5));
const sun = new THREE.DirectionalLight('#fff3d6', 2.2);
sun.position.set(4, 10, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
sun.shadow.bias = -0.0015;
scene.add(sun);

const matCache = new Map();
function mat(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o }));
  return matCache.get(key);
}
function mesh(geo, m, cast = true) { const o = new THREE.Mesh(geo, m); o.castShadow = cast; o.receiveShadow = true; return o; }

/* ---------- the meadow around the garden (built once) ---------- */
const meadow = mesh(new THREE.CircleGeometry(40, 48), mat('#8fd16a'), false);
meadow.rotation.x = -Math.PI / 2; meadow.position.y = -0.12; scene.add(meadow);
const clouds = [];
for (let i = 0; i < 5; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 4; j++) {
    const s = mesh(new THREE.SphereGeometry(0.7 + (j % 2) * 0.35, 14, 10), mat('#ffffff', { roughness: 1 }), false);
    s.position.set(j * 0.8 - 1.2, (j % 2) * 0.3, 0); c.add(s);
  }
  c.position.set(-14 + i * 7, 5.5 + (i % 3) * 0.8, -12 - (i % 2) * 3);

/* ======== levels ======== */
let L = null, levelIdx = 0, program = [], running = false, runId = 0, fails = 0, hintsUsed = 0, runs = 0;

function parse(def) {
  const h = def.map.length, w = def.map[0].length;
  const out = { def, w, h, blocked: new Map(), flowers: [], start: null, dir: DIRS[def.dir || (def.cards === 'arrows' ? 'S' : 'N')] };
  def.map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === 'B') out.start = { x, y };
    else if (ch === 'F') out.flowers.push({ x, y });
    else if ('#om'.includes(ch)) out.blocked.set(x + ',' + y, ch);
  }));
  return out;
}
const worldX = (x) => x - (L.w - 1) / 2, worldZ = (y) => y - (L.h - 1) / 2;
const blocked = (x, y) => x < 0 || y < 0 || x >= L.w || y >= L.h || L.blocked.has(x + ',' + y);
const flowerAt = (x, y) => L.flowers.find((f) => f.x === x && f.y === y);

// Shortest plan that visits every flower (BFS over square, heading and flowers visited); also used for the hint path.
function solve(lv) {
  const turns = lv.def.cards === 'turns', full = (1 << lv.flowers.length) - 1;
  const fIdx = (x, y) => lv.flowers.findIndex((f) => f.x === x && f.y === y);
  const block = (x, y) => x < 0 || y < 0 || x >= lv.w || y >= lv.h || lv.blocked.has(x + ',' + y);
  const s0 = { x: lv.start.x, y: lv.start.y, d: turns ? lv.dir : 0, m: 0, cards: [], cells: [] };
  const key = (s) => `${s.x},${s.y},${s.d},${s.m}`;
  const seen = new Set([key(s0)]), q = [s0];
  while (q.length) {
    const s = q.shift();
    if (s.m === full) return s;
    const moves = turns
      ? [['fwd', s.d], ['tl', (s.d + 3) % 4], ['tr', (s.d + 1) % 4]]
      : [['up', 0], ['right', 1], ['down', 2], ['left', 3]];
    for (const [card, d] of moves) {
      let n;
      if (card === 'tl' || card === 'tr') n = { ...s, d, cards: [...s.cards, card] };
      else {
        const x = s.x + DX[d], y = s.y + DY[d];
        if (block(x, y)) continue;
        const fi = fIdx(x, y);
        n = { x, y, d: turns ? d : 0, m: fi >= 0 ? s.m | (1 << fi) : s.m, cards: [...s.cards, card], cells: [...s.cells, { x, y }] };
      }
      const k = key(n); if (seen.has(k)) continue; seen.add(k); q.push(n);
    }
  }
  return null;
}

function buildLevel() {
  levelGroup.clear(); hintGroup.clear();
  const R = rng(levelIdx * 977 + 13);
  // tiles: a checkerboard so the squares are easy to count
  const tileGeo = new THREE.BoxGeometry(0.96, 0.2, 0.96);
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const t = mesh(tileGeo, mat((x + y) % 2 ? '#6cc94a' : '#a2e67e'), false); t.position.set(worldX(x), 0, worldZ(y)); levelGroup.add(t);
  }
  const base = mesh(new THREE.BoxGeometry(L.w + 0.3, 0.16, L.h + 0.3), mat('#5d9c3f'), false); base.position.y = -0.04; levelGroup.add(base);
  // the start square has a honeycomb mat
  const matHex = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.03, 6), mat('#ffd166'), false); matHex.position.set(worldX(L.start.x), 0.115, worldZ(L.start.y)); levelGroup.add(matHex);
  // fence
  const hw = L.w / 2 + 0.35, hh = L.h / 2 + 0.35, wood = mat('#c98b4f');
  const postGeo = new THREE.BoxGeometry(0.1, 0.5, 0.1);
  const addPost = (x, z) => { const p = mesh(postGeo, wood); p.position.set(x, 0.17, z); levelGroup.add(p); };
  for (let x = -hw; x <= hw + 0.01; x += (2 * hw) / Math.ceil(2 * hw)) { addPost(x, -hh); addPost(x, hh); }
  for (let z = -hh + (2 * hh) / Math.ceil(2 * hh); z < hh - 0.01; z += (2 * hh) / Math.ceil(2 * hh)) { addPost(-hw, z); addPost(hw, z); }
  [0.12, 0.3].forEach((y) => {
    [[0, -hh, 2 * hw, 0.05], [0, hh, 2 * hw, 0.05], [-hw, 0, 0.05, 2 * hh], [hw, 0, 0.05, 2 * hh]].forEach(([x, z, sx, sz]) => {
      const r = mesh(new THREE.BoxGeometry(sx + 0.05, 0.06, sz + 0.05), wood); r.position.set(x, y, z); levelGroup.add(r);
    });
  });
  // things in the garden
  L.flowers.forEach((f, i) => {
    f.got = false; f.mesh = makeFlower(PETALS[(i + levelIdx) % PETALS.length]);
    f.mesh.position.set(worldX(f.x), 0.1, worldZ(f.y)); levelGroup.add(f.mesh);
  });
  L.obstacles = new Map();
  for (const [k, ch] of L.blocked) {
    const [x, y] = k.split(',').map(Number);
    const o = ch === '#' ? makeBush() : ch === 'o' ? makeRock() : makeMushroom();
    o.position.set(worldX(x), 0.1, worldZ(y)); o.rotation.y = R() * Math.PI * 2; levelGroup.add(o); L.obstacles.set(k, o);
  }
  // the meadow outside: trees, little flowers and the hive
  const hive = makeHive(); hive.position.set(-hw - 0.9, -0.1, hh - 0.6); hive.rotation.y = 0.5; levelGroup.add(hive);
  for (let i = 0; i < 9; i++) {
    const a = R() * Math.PI * 2, d = Math.max(hw, hh) + 2.2 + R() * 3;
    const tr = makeTree(); tr.position.set(Math.cos(a) * d * 1.3, -0.1, Math.min(Math.sin(a) * d, -hh - 2.6)); tr.scale.setScalar(0.8 + R() * 0.6); levelGroup.add(tr);
  }
  for (let i = 0; i < 26; i++) {
    const x = (R() - 0.5) * (2 * hw + 7), z = (R() - 0.5) * (2 * hh + 5);
    if (Math.abs(x) < hw + 0.3 && Math.abs(z) < hh + 0.3) continue;
    const f = makeFlower(PETALS[i % PETALS.length], true); f.position.set(x, -0.12, z); f.rotation.y = R() * 6; levelGroup.add(f);
  }
}

/* ======== running the plan ======== */
const CANCEL = Symbol('cancel');
const check = (id) => { if (id !== runId) throw CANCEL; };

async function turnTo(d, ms) {
  const from = bee.rotation.y; let to = yawFor(d);
  while (to - from > Math.PI) to -= Math.PI * 2;
  while (to - from < -Math.PI) to += Math.PI * 2;
  await tween(ms, (k) => { bee.rotation.y = from + (to - from) * k; });
}
async function hop(x, y) {
  const fx = bee.position.x, fz = bee.position.z, tx = worldX(x), tz = worldZ(y);
  await tween(STEP_MS, (k) => { bee.position.x = fx + (tx - fx) * k; bee.position.z = fz + (tz - fz) * k; bee.userData.lift = Math.sin(k * Math.PI) * 0.22; });
}
async function bump(d, x, y) {
  const fx = bee.position.x, fz = bee.position.z, ex = fx + DX[d] * 0.36, ez = fz + DY[d] * 0.36;
  await tween(STEP_MS * 0.5, (k) => { bee.position.x = fx + (ex - fx) * k; bee.position.z = fz + (ez - fz) * k; }, easeIn);
  Sound.bump();
  const ob = L.obstacles.get(x + ',' + y);
  if (ob) tween(500, (k) => { ob.rotation.z = Math.sin(k * Math.PI * 4) * 0.15 * (1 - k); }, (k) => k);
  bee.userData.dizzy.visible = true;
  await tween(320, (k) => { bee.position.x = ex + (fx - ex) * k; bee.position.z = ez + (fz - ez) * k; }, easeOut);
  await wait(800);
  bee.userData.dizzy.visible = false;
}
async function shrug() {
  Sound.shrug();
  const y0 = bee.rotation.y;
  await tween(900, (k) => { bee.rotation.y = y0 + Math.sin(k * Math.PI * 3) * 0.5 * (1 - k); });
}
async function backToStart() {
  Sound.whoosh();
  const fx = bee.position.x, fz = bee.position.z, tx = worldX(L.start.x), tz = worldZ(L.start.y);
  const fromYaw = bee.rotation.y; let toYaw = yawFor(L.dir);
  while (toYaw - fromYaw > Math.PI) toYaw -= Math.PI * 2;
  while (toYaw - fromYaw < -Math.PI) toYaw += Math.PI * 2;
  for (const f of L.flowers) if (f.got) { const m = f.mesh; tween(400, (k) => m.scale.setScalar(1.35 - 0.35 * k)); f.got = false; }
  await tween(900, (k) => {
    bee.position.x = fx + (tx - fx) * k; bee.position.z = fz + (tz - fz) * k;
    bee.userData.lift = Math.sin(k * Math.PI) * 1.1; bee.rotation.y = fromYaw + (toYaw - fromYaw) * k;
  });
  st.x = L.start.x; st.y = L.start.y; st.dir = L.dir;
}
function collect(f) {
  f.got = true; Sound.sip();
  const m = f.mesh; tween(450, (k) => m.scale.setScalar(1 + 0.35 * Math.sin(Math.min(1, k) * Math.PI / 2)), easeOut);
  burst(new THREE.Vector3(m.position.x, 0.75, m.position.z), ['#ffd43b', '#ff8fab', '#ffffff'], 16, 1.6);
}

async function run() {
  if (!program.length) { Sound.nope(); nudge($('prog').querySelector('.slot.next') || $('prog')); nudge($('pad')); return; }
  const id = ++runId; runs++;
  setRunning(true); clearMarks(); hintGroup.clear(); $('hint').classList.remove('on');
  try {
    Sound.buzz(true);
    for (let i = 0; i < program.length; i++) {
      markCard(i, 'now');
      const c = program[i];
      if (c === 'tl' || c === 'tr') {
        st.dir = (st.dir + (c === 'tr' ? 1 : 3)) % 4;
        await turnTo(st.dir, TURN_MS); check(id); markCard(i, 'done'); continue;
      }
      const d = c === 'fwd' ? st.dir : ABS_DIR[c];
      if (d !== st.dir) { st.dir = d; await turnTo(d, TURN_MS * 0.6); check(id); }
      const tx = st.x + DX[d], ty = st.y + DY[d];
      if (blocked(tx, ty)) {
        markCard(i, 'bad'); Sound.buzz(false);
        await bump(d, tx, ty); check(id);
        return await fail(id, i, 'bump');
      }
      await hop(tx, ty); check(id);
      st.x = tx; st.y = ty; markCard(i, 'done');
      const f = flowerAt(tx, ty);
      if (f && !f.got) {
        collect(f);
        if (L.flowers.every((g) => g.got)) { Sound.buzz(false); return await win(id); }
      }
    }
    Sound.buzz(false);
    await shrug(); check(id);
    return await fail(id, program.length - 1, 'short');
  } catch (e) { if (e !== CANCEL) throw e; }
}
async function fail(id, i, why) {
  window.tbxEvent?.('run', { level: levelIdx + 1, cards: program.length, result: why });
  await wait(250); check(id);
  await backToStart(); check(id);
  fails++;
  $('prog').querySelectorAll('.card').forEach((c) => c.classList.remove('now', 'done'));
  setRunning(false);
  if (fails >= HINT_AFTER_FAILS) $('hint').hidden = false;
}
async function win(id) {
  $('prog').querySelectorAll('.card').forEach((c) => c.classList.remove('now'));
  Sound.win();
  burst(new THREE.Vector3(bee.position.x, 0.9, bee.position.z), ['#ff6fa8', '#ffd43b', '#4fa3ff', '#69db7c', '#ffffff'], 40, 2.6);
  const y0 = bee.rotation.y;
  await tween(1100, (k) => { bee.rotation.y = y0 + k * Math.PI * 2; bee.userData.lift = Math.sin(k * Math.PI) * 0.7; }); check(id);
  unlocked = Math.max(unlocked, Math.min(levelIdx + 1, LEVELS.length - 1)); save('unlocked', unlocked);
  window.tbxEvent?.('level-end', { level: levelIdx + 1, won: true, runs, hints: hintsUsed, cards: program.length });
  setRunning(false); renderDots();
  const last = levelIdx === LEVELS.length - 1;
  $('winFlowers').textContent = '🌼'.repeat(L.flowers.length) + ' 🐝';
  $('winText').textContent = last ? 'All gardens done!' : 'Yum!';
  $('next').hidden = last;
  $('win').hidden = false;
  if (last) setTimeout(() => { if (!$('win').hidden) $('win').onclick = () => { $('win').onclick = null; loadLevel(0); }; }, 600);
}
function stop(silent) {
  runId++; cancelTweens(); Sound.buzz(false);
  if (L) resetBee();
  setRunning(false); clearMarks();
}

/* ======== camera fit + main loop ======== */
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h || !L) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const el = THREE.MathUtils.degToRad(CAM_ELEVATION), dir = new THREE.Vector3(0, Math.sin(el), Math.cos(el)), target = new THREE.Vector3(0, 0.15, 0.1);
  const hw = L.w / 2 + 0.45, hh = L.h / 2 + 0.45, pts = [];
  for (const x of [-hw, hw]) for (const z of [-hh, hh]) for (const y of [0, 0.75]) pts.push(new THREE.Vector3(x, y, z));
  const v = new THREE.Vector3();
  const place = (d) => { camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); };
  const topRoom = 1 - 2 * (64 / h);  // leave the HUD row free
  const fits = () => pts.every((p) => { v.copy(p).project(camera); return Math.abs(v.x) <= 0.93 && v.y <= topRoom && v.y >= -0.94; });
  let lo = 2, hi = 60;
  for (let k = 0; k < 26; k++) { const mid = (lo + hi) / 2; place(mid); if (fits()) hi = mid; else lo = mid; }
  place(hi);
}
new ResizeObserver(fitCamera).observe(stage);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const tw of [...tweens]) {
    const k = Math.min(1, (now - tw.t0) / tw.ms); tw.fn(tw.ease(k));
    if (k >= 1) { tweens.delete(tw); tw.res(); }
  }
  const u = bee.userData, t = now / 1000;
  u.body.position.y = 0.42 + u.lift + Math.sin(t * 3) * 0.04;
  u.wings.forEach((w, i) => { w.rotation.z = (i ? -1 : 1) * (0.25 + Math.sin(t * (running ? 48 : 30)) * 0.45); });
  u.dizzy.rotation.y += dt * 6;
  u.chev.material.opacity = 0.55 + Math.sin(t * 4) * 0.3;
  if (L) for (const f of L.flowers) { if (f.got) f.mesh.userData.petals.rotation.y += dt * 1.5; f.mesh.userData.head.rotation.z = Math.sin(t * 1.3 + f.x) * 0.06; }
  hintGroup.children.forEach((d) => { d.position.y = 0.16 + Math.max(0, Math.sin(t * 5 - d.userData.i * 0.7)) * 0.12; });
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 18) c.position.x = -18; }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i], d = s.userData; d.life -= dt * 1.1;
    d.v.y -= 5 * dt; s.position.addScaledVector(d.v, dt); s.rotation.x += dt * 6; s.rotation.y += dt * 4; s.scale.setScalar(Math.max(0.01, d.life));
    if (d.life <= 0) { scene.remove(s); sparks.splice(i, 1); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => { if (document.hidden) Sound.buzz(false); else if (running) Sound.buzz(true); });

// every garden must be solvable within MAX_CARDS (a check for whoever edits LEVELS)
window.__par = LEVELS.map((d, i) => { const s = solve(parse(d)); if (!s || s.cards.length > MAX_CARDS) console.warn('Bee Garden: level', i + 1, 'needs', s ? s.cards.length : 'no', 'cards'); return s ? s.cards.length : null; });

renderMute();
loadLevel(Math.min(unlocked, LEVELS.length - 1));
requestAnimationFrame(frame);
</script>
